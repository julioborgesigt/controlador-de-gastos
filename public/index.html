<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (error) {}
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Controle de gastos</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite" aria-busy="true">
      <main class="screen boot">
        <div class="boot-mark" style="--progress: 0.12">
          <svg class="boot-ring" viewBox="0 0 88 88" aria-hidden="true">
            <circle class="boot-ring-track" cx="44" cy="44" r="38"></circle>
            <circle class="boot-ring-value" cx="44" cy="44" r="38" style="--progress: 0.2"></circle>
          </svg>
          <div class="mark">R$</div>
        </div>
      </main>
    </div>
    <noscript>Ative o JavaScript para usar o controle de gastos neste celular.</noscript>
    <script src="/app.js" type="module"></script>
  </body>
</html>
